limit_req_zone $binary_remote_addr zone=jiajiao_api:10m rate=5r/s;
server {
    listen 80;
    listen [::]:80;
    server_name jiajiao.mychangliapp.cn jiajiao-admin.mychangliapp.cn;
    location ^~ /.well-known/acme-challenge/ { root /var/www/jiajiao-acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jiajiao-admin.mychangliapp.cn;
    ssl_certificate /etc/letsencrypt/live/jiajiao.mychangliapp.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiajiao.mychangliapp.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 302 https://jiajiao.mychangliapp.cn/platform;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jiajiao.mychangliapp.cn;
    ssl_certificate /etc/letsencrypt/live/jiajiao.mychangliapp.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jiajiao.mychangliapp.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log off;
    error_log /var/log/nginx/jiajiao-error.log warn;
    location / {
        limit_req zone=jiajiao_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8796;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
